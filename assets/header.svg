<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0F172A"/>
    <stop offset="0.5" stop-color="#111827"/>
    <stop offset="1" stop-color="#172554"/>
  </linearGradient>
  <linearGradient id="accent" x1="150" y1="60" x2="1050" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38BDF8"/>
    <stop offset="0.5" stop-color="#818CF8"/>
    <stop offset="1" stop-color="#C084FC"/>
  </linearGradient>
  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>
  <style>
    .title { font: 700 52px Arial, sans-serif; fill: white; }
    .subtitle { font: 400 22px Arial, sans-serif; fill: #CBD5E1; }
    .small { font: 600 16px Arial, sans-serif; fill: #94A3B8; letter-spacing: 2px; }
  </style>
</defs>

<rect width="1200" height="360" rx="28" fill="url(#bg)"/>

<circle cx="1040" cy="55" r="150" fill="#6366F1" opacity="0.25" filter="url(#blur)"/>
<circle cx="120" cy="315" r="140" fill="#0EA5E9" opacity="0.20" filter="url(#blur)"/>

<path d="M0 300 C220 210 320 390 530 275 C760 150 850 300 1200 125"
      stroke="url(#accent)" stroke-width="3" opacity="0.65"/>

<path d="M0 315 C230 225 330 405 545 292 C760 178 900 318 1200 145"
      stroke="#38BDF8" stroke-width="1" opacity="0.22"/>

<text x="72" y="105" class="small">FULL-STACK DEVELOPER</text>
<text x="72" y="175" class="title">Hi, I'm Aidil Koto 👋</text>
<text x="72" y="220" class="subtitle">Building useful web applications with clean code &amp; modern technology.</text>

<rect x="72" y="258" width="172" height="48" rx="24" fill="url(#accent)" opacity="0.95"/>
<text x="158" y="289" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">LET'S BUILD 🚀</text>

<text x="1055" y="315" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#E2E8F0">@aidilkoto87</text>
</svg>
